<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="date-card">
    <label for="date">Select a date</label>
    <input type="date" id="date">
  </div>

  <div class="todo-box">
    <h1>Task List</h1>
    <div class="stats">
      <div class="stats-div">
        <p class="stats-title">Total Tasks</p>
        <p class="stats-value" id="total_tasks_value">20</p>
      </div>
      <div class="stats-div">
        <p class="stats-title">Completed Tasks</p>
        <p class="stats-value" id="completed_tasks_value">20</p>
      </div>
      <div class="stats-div">
        <p class="stats-title">Uncompleted Tasks</p>
        <p class="stats-value" id="uncompleted_tasks_value">20</p>
      </div>
    </div>

    <div class="input-row">
      <input id="inputField" type="text" placeholder="Add a new task" />
      <button id="add_button">Add</button>
    </div>

    <ul class="todo-list">
    </ul>
  </div>
  <script src="index.js"></script>
</body>
</html>
